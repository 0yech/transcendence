name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests (backend)
    runs-on: ubuntu-latest

    # The Prisma client is generated, not committed, and prisma.config.ts won't
    # load without a DATABASE_URL. Generating never connects to the database,
    # so any well-formed URL works.
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/database

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major version as backend/Dockerfile.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      # postinstall already tries this, but ignores failures.
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend
