name: transcendence
services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    depends_on:
      - backend
    # Substitute environment variables in nginx.conf.template with envsubst
    command: /bin/bash -c "envsubst < /etc/nginx/nginx.conf.template '$${BACKEND_PORT}' > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - "80:80"
      - "$FRONTEND_PORT:443"
  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      - database
    command: 'sh -c "npx prisma db push && npx prisma generate && npm run start:prod"'
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_PORT=${BACKEND_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
  database:
    container_name: database
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - database_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  database_data:
